<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Go to a Website</title>
  <style>
    body { font: 18px system-ui, sans-serif; max-width: 600px; margin: 15vh auto; padding: 24px; }
    label { display: block; margin-bottom: 10px; }
    input { box-sizing: border-box; width: 100%; padding: 12px; font: inherit; }
    button { margin-top: 12px; padding: 10px 24px; font: inherit; cursor: pointer; }
    #error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Go to a Website</h1>
  <form id="redirect-form">
    <label for="destination">Website URL</label>
    <input id="destination" type="text" inputmode="url" placeholder="https://example.com" required autocomplete="url">
    <button type="submit">Go</button>
    <p id="error" role="alert"></p>
  </form>
  <script>
    document.getElementById('redirect-form').addEventListener('submit', function (event) {
      event.preventDefault();
      const error = document.getElementById('error');
      error.textContent = '';
      let address = document.getElementById('destination').value.trim();
      if (!address) {
        error.textContent = 'Enter a website URL.';
        return;
      }
      if (!/^[a-z][a-z0-9+.-]*:/i.test(address)) address = 'https://' + address;
      try {
        const destination = new URL(address);
        if (!['http:', 'https:'].includes(destination.protocol)) {
          throw new Error('Only HTTP and HTTPS URLs are allowed.');
        }
        window.location.replace(destination.href);
      } catch (e) {
        error.textContent = 'Enter a valid HTTP or HTTPS website URL.';
      }
    });
  </script>
</body>
</html>
